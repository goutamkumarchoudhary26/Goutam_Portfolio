<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Goutam Kumar — Lead UI React Developer</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      // GitHub Pages serves this file for any path that isn't a real file. It
      // re-encodes the requested path as a query string and redirects to the
      // app root; index.html's inline script decodes it before React Router
      // mounts. pathSegmentsToKeep = 1 because GitHub project pages always
      // serve from /<repo-name>/, regardless of what the repo is named.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
